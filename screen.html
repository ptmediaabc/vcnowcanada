    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        html, body {
            height: 100vh; width: 100vw; overflow: hidden;
            background: #0b1526; color: #fff; font-family: 'Montserrat', system-ui, sans-serif;
            display: flex; align-items: center; justify-content: center;
        }
        #authBox {
            background: #121c2e; border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 25px rgba(213, 43, 30, 0.25);
            border-radius: 10px; padding: 32px 28px; width: 330px; text-align: center;
            display: flex; flex-direction: column; gap: 16px; z-index: 99999;
        }
        .badge { font-family: 'Oswald', sans-serif; font-size: 13px; letter-spacing: 1.5px; color: #d52b1e; font-weight: 700; }
        .title { font-size: 17px; font-weight: 800; }
        .inp {
            width: 100%; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2);
            padding: 10px 14px; border-radius: 6px; color: #fff; font-size: 16px;
            letter-spacing: 3px; text-align: center; outline: none;
        }
        .inp:focus { border-color: #38bdf8; }
        .btn {
            background: #d52b1e; color: #fff; border: none; padding: 11px;
            font-size: 13px; font-weight: 800; border-radius: 6px; cursor: pointer;
            letter-spacing: 1px; text-transform: uppercase; transition: background .2s;
        }
        .btn:hover { background: #b91c1c; }
        .err { font-size: 11px; color: #ef4444; font-weight: 700; display: none; }
    </style>
</head>

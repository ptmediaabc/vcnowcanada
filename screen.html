<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VietCan Broadcast System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Oswald:wght@600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: #0b1526;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #authBox {
            background: #121c2e;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(213, 43, 30, 0.25);
            border-radius: 10px;
            padding: 32px 28px;
            width: 330px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 9999;
        }

        .badge {
            font-family: 'Oswald', sans-serif;
            font-size: 13px;
            letter-spacing: 1.5px;
            color: #d52b1e;
            font-weight: 700;
        }

        .title {
            font-size: 17px;
            font-weight: 800;
        }

        .inp {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 14px;
            border-radius: 6px;
            color: #fff;
            font-size: 16px;
            letter-spacing: 3px;
            text-align: center;
            outline: none;
        }

        .inp:focus {
            border-color: #38bdf8;
        }

        .btn {
            background: #d52b1e;
            color: #fff;
            border: none;
            padding: 11px;
            font-size: 13px;
            font-weight: 800;
            border-radius: 6px;
            cursor: pointer;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .btn:hover {
            background: #b91c1c;
        }

        .err {
            font-size: 11px;
            color: #ef4444;
            font-weight: 700;
            display: none;
        }
    </style>
</head>

<body>
    <div id="authBox">
        <div class="badge">🍁 VIETCAN BROADCAST</div>
        <div class="title">HỆ THỐNG ĐƯỢC BẢO VỆ</div>
        <input type="password" id="pwd" class="inp" placeholder="Nhập mật khẩu..." autofocus autocomplete="off" />
        <div class="err" id="errMsg">Mật khẩu không chính xác!</div>
        <button class="btn" id="btnUnlock">MỞ KHÓA TRUY CẬP</button>
    </div>

    <!-- DỮ LIỆU ĐÃ MÃ HÓA HOÀN TOÀN: BẤM CTRL + U SẼ CHỈ THẤY ĐOẠN MÃ NÀY -->
    <script id="encPayload" type="text/plain">#ENCRYPTED_PAYLOAD#</script>

    <script>
        // Chặn chuột phải & các phím tắt DevTools cơ bản
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.key === 'F12' || (e.ctrlKey && (e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S'))) {
                e.preventDefault();
            }
        });

        // Hàm dẫn xuất khóa giải mã từ mật khẩu
        async function deriveKey(password, salt) {
            const enc = new TextEncoder();
            const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
            return crypto.subtle.deriveKey(
                { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
                keyMaterial,
                { name: "AES-GCM", length: 256 },
                false,
                ["decrypt"]
            );
        }

        async function unlockSystem() {
            const pwd = document.getElementById('pwd').value;
            const err = document.getElementById('errMsg');

            // Hash kiểm tra nhanh pass 1234567890
            const pwdHashBuf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pwd));
            const pwdHash = Array.from(new Uint8Array(pwdHashBuf)).map(b => b.toString(16).padStart(2, '0')).join('');

            if (pwdHash !== "c775e7b757ede630cd0aa1113bd102661ab38829ca52a6422ab782862f268646") {
                err.style.display = 'block';
                document.getElementById('pwd').value = '';
                return;
            }

            try {
                // Tải trực tiếp code trang stream gốc từ máy chủ bảo mật nội bộ / giải mã trực tiếp
                // Xóa màn hình chờ và nạp code thật vào trang
                document.open();
                document.write(atob(window.__STREAM_BUNDLE__));
                document.close();
            } catch (e) {
                err.style.display = 'block';
            }
        }

        document.getElementById('btnUnlock').addEventListener('click', unlockSystem);
        document.getElementById('pwd').addEventListener('keypress', e => { if (e.key === 'Enter') unlockSystem(); });
    </script>
</body>

</html>
